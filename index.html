    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        aru: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316', // Primary Fox Color
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce-slow 3s infinite ease-in-out',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                    },
                    keyframes: {
                        'bounce-slow': {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            'from': { opacity: '0', transform: 'translateY(10px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- File Parsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Database (WASM + IndexedDB) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

    <!-- WebRTC & QR (Data Transfer) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <!-- Google Identity Services (Google Drive OAuth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Config PDF.js Worker -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Markdown Parser (Marked.js) & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "Aru AI",
            "applicationCategory": "ProductivityApplication",
            "operatingSystem": "Web Browser, PWA",
            "url": "https://chat.aru-lab.space/",
            "description": "Local-first personal AI assistant with semantic memory, artifact library, task manager and WebRTC device transfer.",
            "image": "https://chat.aru-lab.space/media/int/web-app-manifest-512x512.png",
            "creator": {
                "@type": "Organization",
                "name": "Aru-Lab",
                "url": "https://chat.aru-lab.space/"
            },
            "offers": {

    </script>
    <style>
        .lang-node {
            display: none;
        }

        .lang-active {
            display: block;
        }

        .search-pulse {
            animation: search-pulse 2s infinite;
        }

        @keyframes search-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        #tools-menu {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(10px) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }

        #tools-menu.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body
    class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans overflow-hidden h-screen w-screen selection:bg-aru-200 dark:selection:bg-aru-900">

    <!-- App Container -->
    <div id="app" class="relative w-full h-full flex flex-col">

        <!-- HEADER (Common) -->
        <header id="main-header"
            class="app-header hidden absolute top-0 w-full z-50 p-3 md:p-4 flex justify-between items-center bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-all duration-300">
            <div class="flex items-center gap-3">
                <!-- Sidebar Toggles -->
                <button onclick="app.toggleSidebar()"
                    class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition"
                    data-i18n-title="toggle_sidebar">
                    <i data-lucide="menu"></i>
                </button>

                <div
                    class="w-8 h-8 rounded-full bg-aru-100 dark:bg-aru-900 flex items-center justify-center text-aru-600 font-bold select-none">
                    🦊
                </div>
                <h1 class="text-lg md:text-xl font-bold tracking-tight select-none">Aru <span
                        class="text-aru-500">Ai</span></h1>
                <span id="chat-title"
                    class="text-sm text-gray-500 dark:text-gray-400 ml-4 hidden lg:block border-l pl-4 border-gray-300 dark:border-gray-700 truncate max-w-[200px]">
                    <!-- Chat Title Dynamic -->
                </span>
            </div>
            <div class="flex items-center gap-1 md:gap-2">
                <!-- Library -->
                <button onclick="app.openLibrary()"
                    class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition text-aru-600 group relative"
                    title="Библиотека" data-i18n-title="sidebar_library">
                    <i data-lucide="library" class="w-5 h-5"></i>
                </button>
                <!-- Configuration Menu (Consolidation) -->
                <div class="relative">
                    <button onclick="app.toggleConfigMenu()" id="btn-config-trigger"
                        class="p-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-aru-600 hover:bg-aru-50 dark:hover:bg-aru-900/20 transition-all shadow-sm">
                        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                    </button>

                    <!-- Config Menu Popup -->
                    <div id="config-menu"
                        class="app-popover absolute top-full right-0 mt-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-2xl p-3 z-[60] min-w-[220px] hidden animate-fade-in">

                        <!-- Segmented Language Switcher -->
                        <div class="flex p-1 bg-gray-50 dark:bg-gray-800 rounded-xl mb-3">
                            <button onclick="app.setLang('kk')" data-lang-btn="kk"
                                class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all">KZ</button>
                            <button onclick="app.setLang('en')" data-lang-btn="en"
                                class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all">EN</button>
                            <button onclick="app.setLang('ru')" data-lang-btn="ru"
                                class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all">RU</button>
                        </div>

                        <!-- Theme Toggle Button -->
                        <button id="theme-toggle"
                            class="w-full flex items-center gap-3 p-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl transition-colors mb-1">
                            <div
                                class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
                                <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                                <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                            </div>
                            <span data-i18n="label_theme">Theme</span>
                        </button>

                        <button onclick="app.openSettings(); app.toggleConfigMenu()"
                            class="w-full flex items-center gap-3 p-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl transition-colors mb-1">
                            <div
                                class="w-8 h-8 rounded-lg bg-blue-50 dark:bg-blue-900/20 text-blue-500 flex items-center justify-center">
                                <i data-lucide="settings" class="w-4 h-4"></i>
                            </div>
                            <span data-i18n="settings_title">Settings</span>
                        </button>

                        <!-- Moved from sidebar: Information & Forum -->
                        <button onclick="app.openInfo(); app.toggleConfigMenu()"
                            class="w-full flex items-center gap-3 p-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl transition-colors mb-1">
                            <div
                                class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 flex items-center justify-center">
                                <i data-lucide="info" class="w-4 h-4"></i>
                            </div>
                            <span data-i18n="sidebar_info">Information</span>
                        </button>

                        <button onclick="window.open('https://forum.aru-lab.space','_blank'); app.toggleConfigMenu()"
                            class="w-full flex items-center gap-3 p-3 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl transition-colors mb-1">
                            <div
                                class="w-8 h-8 rounded-lg bg-gray-50 dark:bg-gray-800 text-gray-500 flex items-center justify-center">
                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                            </div>
                            <span data-i18n="sidebar_forum">Forum</span>
                        </button>

                        <button onclick="app.logout(); app.toggleConfigMenu()"
                            class="w-full flex items-center gap-3 p-3 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-xl transition-colors">
                            <div
                                class="w-8 h-8 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-500 flex items-center justify-center">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </div>
                            <span data-i18n="logout">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- SCREENS -->

        <!-- 1. AUTH SCREEN (Login/Create) -->
        <section id="screen-auth" data-nosnippet class="auth-stage flex-1 flex items-center justify-center p-4 z-50 bg-gray-50 dark:bg-gray-900">
            <div
                class="auth-card max-w-md w-full bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-100 dark:border-gray-700 relative overflow-hidden animate-fade-in">
                <!-- Mascot Greeting -->
                <div class="flex flex-col items-center mb-8 relative z-10">
                    <div class="w-32 h-32 mb-4 relative drop-shadow-xl">
                        <!-- Updated Mascot Path -->
                        <img src="media/emotions/cool.png" alt="Aru" class="w-full h-full object-contain animate-bounce-slow">
                    </div>
                    <h2 class="text-3xl font-bold text-center mb-2 tracking-tight" data-i18n="welcome_title"></h2>
                    <p class="text-gray-500 dark:text-gray-400 text-center text-sm px-4" data-i18n="welcome_desc"></p>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-3 relative z-10">
                    <button onclick="app.openModal('create')"
                        class="group w-full py-3.5 px-4 bg-aru-500 hover:bg-aru-600 text-white rounded-xl font-semibold transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-aru-500/30">
                        <i data-lucide="plus-circle" class="w-5 h-5 group-hover:rotate-90 transition-transform"></i>
                        <span data-i18n="btn_create_db"></span>
                    </button>
                    <button onclick="app.openModal('login')"
                        class="group w-full py-3.5 px-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-700 dark:text-white rounded-xl font-medium transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
                        <i data-lucide="key-round"
                            class="w-5 h-5 text-gray-400 group-hover:text-aru-500 transition-colors"></i>
                        <span data-i18n="btn_open_db"></span>
                    </button>
                    <button type="button" onclick="app.openModal('remote')"
                        class="group w-full py-3.5 px-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-900/40 text-blue-700 dark:text-blue-300 rounded-xl font-medium transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2">
                        <i data-lucide="hard-drive"
                            class="w-5 h-5 text-blue-500 dark:text-blue-400 group-hover:scale-110 transition-transform"></i>
                        <span data-i18n="btn_remote_db">Google Drive / WebDAV</span>
                    </button>
                </div>

                <!-- Footer Info -->
                <div class="mt-8 text-center relative z-10">
                    <div class="flex flex-col items-center gap-4">
                        <div class="flex items-center justify-center gap-2">
                            <select id="auth-lang-select"
                                class="text-sm bg-gray-100 dark:bg-gray-900 text-gray-600 dark:text-gray-300 rounded-lg px-3 py-1.5 border-none focus:ring-2 focus:ring-aru-500 cursor-pointer">
                                <option value="kk">Қазақша</option>
                                <option value="ru" selected>Русский</option>
                                <option value="en">English</option>
                            </select>

                            <div class="flex gap-1">
                                <button onclick="app.openInfo()" class="p-2 text-gray-400 hover:text-aru-500 transition"
                                    data-i18n-title="sidebar_info">
                                    <i data-lucide="info" class="w-5 h-5"></i>
                                </button>
                                <a href="https://forum.aru-lab.space" target="_blank"
                                    class="p-2 text-gray-400 hover:text-aru-500 transition"
                                    data-i18n-title="sidebar_forum">
                                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold"
                        data-i18n="footer_copyright">Aru
                        Ai v{{APP_VERSION}} • Secure & Private</p>
                </div>
            </div>
        </section>

        <!-- 2. MAIN CHAT INTERFACE (Hidden by default) -->
        <section id="screen-chat" class="hidden h-full min-h-0 pt-[60px] md:pt-[72px]">

            <!-- Sidebar Backdrop (Mobile) -->
            <div id="sidebar-backdrop" onclick="app.toggleSidebar()"
                class="fixed inset-0 bg-black/50 z-40 hidden md:hidden transition-opacity duration-300 backdrop-blur-sm">
            </div>

            <!-- Sidebar (Desktop Collapsible / Mobile Slide-over) -->
            <aside id="sidebar"
                class="app-sidebar fixed md:relative inset-y-0 left-0 w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-[60] transform -translate-x-full md:translate-x-0 transition-all duration-300 overflow-hidden">
                <div class="px-5 pt-1 pb-4 space-y-3">
                    <!-- Chat Search -->
                    <div class="relative group">
                        <i data-lucide="search"
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 group-focus-within:text-aru-500 transition-colors"></i>
                        <input type="text" id="chat-search"
                            class="w-full pl-9 pr-3 h-[36px] bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl text-xs outline-none focus:border-aru-400 transition-all"
                            oninput="app.searchChats(this.value)">
                    </div>

                    <div class="flex gap-2">
                        <button onclick="app.newChat()"
                            class="flex-1 py-2.5 px-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:border-aru-400 hover:shadow-md transition-all flex items-center justify-center gap-2 text-sm font-medium text-gray-700 dark:text-gray-200">
                            <i data-lucide="plus" class="w-4 h-4 text-aru-500"></i>
                            <span data-i18n="sidebar_new_chat"></span>
                        </button>
                        <button onclick="app.newChat(true)"
                            class="w-12 h-10.5 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800 rounded-xl shadow-sm hover:border-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-all flex items-center justify-center text-blue-600 dark:text-blue-400"
                            data-i18n-title="sidebar_private_chat">
                            <i data-lucide="shield-check" class="w-5 h-5"></i>
                        </button>
                        <button onclick="app.openPlugins()"
                            class="w-12 h-10.5 bg-purple-50 dark:bg-purple-900/20 border border-purple-100 dark:border-purple-800 rounded-xl shadow-sm hover:border-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900/40 transition-all flex items-center justify-center text-purple-600 dark:text-purple-400"
                            data-i18n-title="sidebar_plugins">
                            <i data-lucide="app-window" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto px-3 space-y-1 custom-scrollbar" id="chat-list">
                    <!-- Chat List Items will be injected here via JS -->
                </div>

                <!-- Sidebar Footer -->
                <div class="p-4 flex flex-col gap-3">

                    <!-- Mobile Tabs Toggle (Moved up) -->
                    <button onclick="app.openTabSwitcher()"
                        class="md:hidden w-full py-2.5 bg-aru-50 dark:bg-aru-900/20 text-aru-600 rounded-xl border border-aru-100 dark:border-aru-800 flex items-center justify-center gap-2 text-sm font-bold relative mb-3">
                        <i data-lucide="layers" class="w-4 h-4"></i>
                        <span data-i18n="tabs_button">Вкладки</span>
                        <span id="mobile-tabs-count"
                            class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-aru-500 text-white text-[10px] rounded-full flex items-center justify-center shadow-sm border border-white dark:border-gray-950 hidden">0</span>
                    </button>

                    <!-- Sidebar action buttons removed — moved to Config Menu -->

                    <!-- Real-time Sync Status & Transfer -->
                    <div class="flex items-center gap-2">
                        <div id="sync-status"
                            class="hidden flex-1 flex items-center gap-2 px-3 py-2 bg-white dark:bg-gray-900 rounded-lg border border-gray-100 dark:border-gray-800">
                            <div id="sync-dot" class="w-2 h-2 rounded-full bg-green-500 transition-colors duration-500">
                            </div>
                            <span id="sync-text" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"
                                data-i18n="sync_status_synced"></span>
                        </div>
                        <button onclick="app.openTransferModal()"
                            class="p-2 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-lg text-gray-400 hover:text-aru-500 transition shadow-sm"
                            data-i18n-title="btn_transfer_data">
                            <i data-lucide="qr-code" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Chat Area -->
            <main class="chat-workspace flex-1 min-h-0 min-w-0 flex flex-col relative bg-white dark:bg-gray-900 overflow-hidden">
                <!-- Tabs Bar (Desktop) -->
                <div id="tabs-navigation" class="tab-navigation hidden md:flex items-center">
                    <button type="button" id="tabs-scroll-left" class="tab-scroll-button" onclick="app.scrollTabs(-1)"
                        aria-label="Previous tabs" title="Previous tabs">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <div id="tabs-bar" class="tab-strip flex min-w-0 flex-1 items-center overflow-x-auto no-scrollbar"
                        role="tablist">
                        <!-- Tabs will be injected here -->
                    </div>
                    <button type="button" id="tabs-scroll-right" class="tab-scroll-button" onclick="app.scrollTabs(1)"
                        aria-label="Next tabs" title="Next tabs">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Messages List -->
                <div id="messages-container" class="chat-stream flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth z-10 relative">
                    <!-- Messages will be injected here -->
                </div>

                <!-- Welcome Placeholder (Overlay) -->
                <div id="chat-placeholder" class="chat-empty-state h-full flex flex-col items-center justify-center text-center p-8">

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            let swRefreshPending = false;
            let swShouldReloadOnControllerChange = false;

            const bindWorkerLifecycle = (worker) => {
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        swShouldReloadOnControllerChange = true;
                    }
                });
            };

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('SW: Registered', reg);

                        bindWorkerLifecycle(reg.installing);
                        reg.addEventListener('updatefound', () => bindWorkerLifecycle(reg.installing));

                        if (reg.waiting && navigator.serviceWorker.controller) {
                            swShouldReloadOnControllerChange = true;
                        }

                        const requestUpdateCheck = () => reg.update().catch(err => console.log('SW: Update check failed', err));

                        requestUpdateCheck();
                        window.addEventListener('focus', requestUpdateCheck);
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') requestUpdateCheck();
                        });
                        window.setInterval(requestUpdateCheck, 15 * 60 * 1000);
                    })
                    .catch(err => console.log('SW: Registration failed', err));
            });

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (swRefreshPending || !swShouldReloadOnControllerChange) return;
                swRefreshPending = true;
                window.location.reload();
            });
        }
    </script>
